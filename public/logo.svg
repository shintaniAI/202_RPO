<svg width="200" height="120" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bar { stroke: black; stroke-width: 2; }
      .line { stroke: black; stroke-width: 2; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <g transform="skewX(-30) translate(20, 5)">
    <!-- Left Column -->
    <rect x="0" y="0" width="20" height="12" fill="#D7000F" class="bar" />
    <rect x="0" y="18" width="20" height="12" fill="#FFD700" class="bar" />
    
    <!-- Middle Column -->
    <rect x="25" y="8" width="20" height="12" fill="black" class="bar" />
    <rect x="25" y="26" width="20" height="12" fill="black" class="bar" />
    
    <!-- Right Column -->
    <rect x="50" y="0" width="20" height="12" fill="#0099D9" class="bar" />
    <rect x="50" y="18" width="20" height="12" fill="#6A2C70" class="bar" />
    
    <!-- Connecting Lines (Zig Zag) -->
    <!-- Red bottom-right to Black top-left -->
    <line x1="20" y1="12" x2="25" y2="8" class="line" />
    <!-- Yellow top-right to Black bottom-left -->
    <line x1="20" y1="18" x2="25" y2="26" class="line" />
    
    <!-- Black top-right to Blue bottom-left -->
    <line x1="45" y1="8" x2="50" y2="0" class="line" />
    <!-- Black bottom-right to Purple top-left -->
    <line x1="45" y1="26" x2="50" y2="18" class="line" />
  </g>
</svg>
